# Refresh the reservoir storage, river flow and snowpack data from CDEC once a month, after the operators
# have filed the previous month, and commit it only when something changed. The page computes
# every count and date range from the data files, so a new month shows up without code changes.
name: Refresh CDEC data

on:
  schedule:
    - cron: "0 6 12 * *"   # 06:00 UTC on the 12th of each month
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write   # to ask Pages to rebuild after the data commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch CDEC storage and flow
        run: python3 scripts/fetch_cdec.py
      - name: Rebuild snowpack (needs the storage months above)
        run: python3 scripts/fetch_snow.py
      - name: Commit if the data changed
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "No new data."
            exit 0
          fi
          # The file is sorted by reservoir, not date, so take the latest month over all rows.
          last=$(tail -n +2 data/reservoir_storage_monthly.csv | cut -d, -f2 | sort | tail -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data: CDEC refresh through ${last}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow's own token may not start a Pages build, so ask for one.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
